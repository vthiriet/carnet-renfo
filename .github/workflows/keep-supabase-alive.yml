name: Garder Supabase actif

on:
  schedule:
    - cron: '0 8 * * 1,4'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (lecture seule)
        run: |
          curl -s -o /dev/null -w "Statut HTTP : %{http_code}\n" \
            "${SUPABASE_URL}/rest/v1/progress?select=completed_count&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
